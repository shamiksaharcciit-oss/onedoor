[project]
name = "onedoor"
version = "0.3.0"
description = "A tiered guardrail/policy engine for agentic systems: default-deny, bounds, caps, approvals, dry-run, kill switch, and reversibility as a precondition for autonomy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Shamik Saha" }]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn>=0.34"]
otel = ["opentelemetry-api>=1.27"]
dev = ["pytest>=8.3", "mypy>=1.14", "ruff>=0.8", "fastapi>=0.115", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onedoor*"]
