[project]
name = "onedoor"
version = "0.3.5"
description = "A tiered guardrail/policy engine for agentic systems: default-deny, bounds, caps, approvals, dry-run, kill switch, and reversibility as a precondition for autonomy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Shamik Saha" }]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    # Windows ships no IANA tz database, so zoneinfo cannot resolve even "UTC".
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/shamiksaharcciit-oss/onedoor"
Repository = "https://github.com/shamiksaharcciit-oss/onedoor"
Issues = "https://github.com/shamiksaharcciit-oss/onedoor/issues"
Changelog = "https://github.com/shamiksaharcciit-oss/onedoor/releases"

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn>=0.34"]
otel = ["opentelemetry-api>=1.27"]
# Everything under examples/ needs these. They are not runtime
# dependencies of the engine -- onedoor governs LangGraph, it does not
# require it -- but the examples are documented artifacts and a reader who
# follows the docs should not have to guess what to install.
examples = ["langgraph>=1.0", "langchain-core>=1.0"]
# The agent-middleware integration. LangChain v1 or later: `wrap_tool_call`
# does not exist before it.
langchain = ["langchain>=1.0"]
# ruff is PINNED, not floated. Lint rule sets change between ruff releases, so an
# unpinned linter makes CI non-deterministic: the job can go red on a morning
# nobody touched the code. Bump it deliberately, as its own commit (ND-025).
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.14,<2", "ruff==0.16.4",
       "fastapi>=0.115", "httpx>=0.27", "langchain>=1.0", "langgraph>=1.0",
       "types-PyYAML>=6.0"]

# ND-025. Lint rules are a decision, not a default. Without this block `ruff check`
# lints against whatever rule set the newest ruff ships with, so a CI job can go red
# on a morning nobody touched the code. Pinned versions in [dev] close the other half.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# BLE001 (blind except) is deliberately NOT selected: fail-soft on connector failure
# is a designed behaviour of this engine, not an oversight. If it is ever selected,
# each site needs reading, not an auto-fix.

[tool.ruff.lint.per-file-ignores]
# Re-exports: the package surface is deliberate.
"onedoor/__init__.py" = ["F401"]
"onedoor/guardrail/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true

# OpenTelemetry is an optional extra: telemetry.py imports it inside a try/except
# and no-ops without it. CI installs [dev], not [otel], so the import is absent by
# design -- that is the behaviour the module is built for, not a missing dependency.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onedoor*"]

# Without this the wheel ships the Python modules and drops
# onedoor/store/migrations/*.sql, so Database.init() applies no migrations and the
# first query fails with "no such table: policies". 0.3.0 on PyPI has this defect.
[tool.setuptools.package-data]
onedoor = ["store/migrations/*.sql"]
