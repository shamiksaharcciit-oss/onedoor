[project]
name = "onedoor"
version = "0.6.2"
description = "A tiered guardrail/policy engine for agentic systems: default-deny, bounds, caps, approvals, dry-run, kill switch, and reversibility as a precondition for autonomy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Shamik Saha" }]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    # Windows ships no IANA tz database, so zoneinfo cannot resolve even "UTC".
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/shamiksaharcciit-oss/onedoor"
Repository = "https://github.com/shamiksaharcciit-oss/onedoor"
Issues = "https://github.com/shamiksaharcciit-oss/onedoor/issues"
Changelog = "https://github.com/shamiksaharcciit-oss/onedoor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Ed25519 signing (ND-015). An EXTRA rather than a hard requirement, ruled by R038 §2:
# chaining is opt-in and signing rides it, so a library-only user who never signs
# should not carry a crypto dependency for a feature they have not switched on.
#
# X-6 -- "alarm dependencies are hard requirements, never optional extras" -- is
# enforced at ENABLE time instead of install time, which is the reading that actually
# closes the failure mode. A hard install dependency guarantees nothing about config,
# and the deployment that believes it is signing and is not was always going to believe
# it because of its config. So: signing configured + library missing = the process
# REFUSES TO START, asserted by a test as a stated invariant.
#
# A range, not an exact pin, in the package: exact-pinning a runtime dependency of a
# LIBRARY is hostile to every downstream that also depends on it (ND-040/U1's own
# reasoning). CI pins the version, and the register records it -- process provenance
# lives at the deployment layer, because Ed25519's OUTPUT cannot change with the
# library (RFC 8032), so a version in per-row evidence would assert a dependence that
# does not exist.
signed = ["cryptography>=42,<48"]
service = ["fastapi>=0.115", "uvicorn>=0.34"]
# The Policy Studio's canvas (ND-052/S3). Its own extra rather than part of [service],
# because R047 §1 made them separate PROCESSES on purpose: onedoor.service is the PDP,
# and an operator GUI that changes the rules must not ride on the credential that
# answers decisions. Sharing an extra would quietly re-couple what the split separated.
#
# X-6 at the point of use, as with [signed]: the canvas has to run engine functions to
# show any number at all, so a missing FastAPI is a REFUSAL naming the remedy rather
# than a static fallback -- there is no honest static fallback here.
#
# `python-multipart` is here for ND-056/T1's file upload, and it REVERSES a decision
# recorded in `server.create_draft`: "a dependency for one text field is one the
# [studio] extra does not need". That reasoning stands for a text field and does not
# reach a FILE field -- `<input type=file>` forces multipart/form-data, and there is no
# urlencoded route to it. The only alternative is hand-parsing multipart, which is a
# second implementation of a parser in a codebase whose whole doctrine is that there is
# one parser. Approved as a reversal with its reason stated (R066 §5) rather than left
# as a comment that quietly became wrong.
studio = ["fastapi>=0.115", "uvicorn>=0.34", "python-multipart>=0.0.9"]
otel = ["opentelemetry-api>=1.27"]
# Everything under examples/ needs these. They are not runtime
# dependencies of the engine -- onedoor governs LangGraph, it does not
# require it -- but the examples are documented artifacts and a reader who
# follows the docs should not have to guess what to install.
examples = ["langgraph>=1.0", "langchain-core>=1.0"]
# The agent-middleware integration. LangChain v1 or later: `wrap_tool_call`
# does not exist before it.
langchain = ["langchain>=1.0"]
# The LiteLLM gateway guardrail example. Its own extra rather than part of
# [examples]: litellm is a large dependency tree and a reader who wants the
# LangGraph examples should not pay for it. Declared because
# examples/litellm_guardrail.py imports it -- until 0.3.6 it imported a package no
# extra installed, so anyone following the docs hit ModuleNotFoundError.
# Deliberately NOT in [dev]: the example's tests use a stand-in for the base class,
# so CI stays light and does not gain a heavy transitive tree it never exercises.
litellm = ["litellm>=1.60"]
# ruff is PINNED, not floated. Lint rule sets change between ruff releases, so an
# unpinned linter makes CI non-deterministic: the job can go red on a morning
# nobody touched the code. Bump it deliberately, as its own commit (ND-025).
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.14,<2", "ruff==0.16.4",
       "fastapi>=0.115", "httpx>=0.27", "langchain>=1.0", "langgraph>=1.0",
       # Declared here as well as in [studio] for the reason stated two entries down
       # about langchain-core: the upload tests exercise a multipart route, and a
       # dependency that reaches CI only because something else happens to pull it is a
       # gate that can go red on a morning nobody touched the code.
       "python-multipart>=0.0.9",
       # `onedoor.integrations` imports `langchain_core` directly. It reaches CI today
       # only as a transitive dependency of the two above, which is the fragility the
       # ruff pin's own comment argues against: a gate that goes red on a morning nobody
       # touched the code, because an upstream restructured its requirements. Found by
       # `tests/test_packaging.py` the moment that test was written -- a second instance
       # of the defect that produced it.
       "langchain-core>=1.0",
       "types-PyYAML>=6.0",
       # PINNED, not ranged, unlike the [signed] extra: CI must be reproducible, and
       # an unpinned crypto library makes a gate that can go red on a morning nobody
       # touched the code -- the same argument that pins ruff. This is the version the
       # register records (R038 §3): process provenance at the deployment layer.
       "cryptography==46.0.4",
       # The Studio server's runtime (ND-052/S3). Here for the same reason
       # `cryptography` is: an optional dependency the package IMPORTS must be present
       # for `mypy onedoor`, or the gate silently skips checking the one call site that
       # uses it. A `ignore_missing_imports` override would have made CI green by making
       # it check less, which is the wrong direction.
       #
       # This one was found the hard way: CI went red on `import uvicorn` while the
       # local gate passed, because the local venv had uvicorn and [dev] did not.
       # `tests/test_packaging.py::test_every_third_party_import_is_declared_in_dev`
       # now catches that class locally, at the moment the import is written.
       "uvicorn>=0.34"]

# ND-025. Lint rules are a decision, not a default. Without this block `ruff check`
# lints against whatever rule set the newest ruff ships with, so a CI job can go red
# on a morning nobody touched the code. Pinned versions in [dev] close the other half.
[tool.ruff]
line-length = 100
target-version = "py312"
# A linter is a normalising filter, and this repository holds material that must not
# be normalised. Same two-discipline rule as .gitattributes and E10: generated data
# normalises, received data is frozen verbatim. Excluded here, not per-file-ignored,
# because `ruff format` obeys `exclude` and would otherwise rewrite these bytes.
exclude = [
    # Core's vendored, digest-pinned artifact. `ruff check .` currently reports 10
    # findings in it, 5 of them auto-fixable -- and `ruff check --fix .` is exactly
    # what someone reaches for when CI is red. That would rewrite canonical.py, the
    # module CLAUDE.md says is vendored verbatim and never reimplemented, and every
    # pinned manifest would stop verifying. Do not lint core's bytes.
    "reference/rederivable-manifest",
    # The vendored copy of the same artifact. Excluded for the identical reason: it
    # must stay byte-identical to its origin, and `ruff format` would rewrite it.
    "onedoor/_vendor",
    # The Studio v2 token block, same discipline: received bytes with a pinned
    # digest. Ruff does not format CSS, but the exclusion is declared anyway --
    # a fence that depends on a tool never gaining a feature is not a fence.
    "onedoor/studio/_vendor",
    # ANY virtualenv, whatever it is called. Ruff's defaults exclude `.venv`; they do
    # not exclude `venv`, and they cannot know about an operator's scratch directory.
    #
    # Learned expensively: a `ruff check . --fix` run from the repo root walked into
    # `onedoor-trial/venv/` -- an operator's validation workspace, untracked, sitting
    # beside the source -- and rewrote 411 third-party files. Nothing of ours was
    # touched and nothing was lost, but a formatter reaching outside the tree it was
    # pointed at is a byte-rewriting tool escaping its fence, which is the exact hazard
    # E10 exists to name. `tests/test_formatter_fence.py` now fails if a directory
    # holding a `pyvenv.cfg` is not covered by this list.
    "**/venv",
    "**/.venv",
    "**/site-packages",
    "onedoor-trial",
    # Markdown. Ruff formats Python inside fenced blocks, and every .md here is
    # evidence rather than source: BACKLOG/TICKETS quote defects *verbatim* so the
    # quote matches the file it indicts (reformatting ND-021's snippet would make it
    # no longer match examples/litellm_guardrail.py), and docs/from_core/ memos are
    # pinned by `Integrity: sha256(body)` -- reformatting a code block inside one
    # would break core's digest and fail tests/protocol/.
    "*.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# BLE001 (blind except) is deliberately NOT selected: fail-soft on connector failure
# is a designed behaviour of this engine, not an oversight. If it is ever selected,
# each site needs reading, not an auto-fix.

[tool.ruff.lint.per-file-ignores]
# Re-exports: the package surface is deliberate.
"onedoor/__init__.py" = ["F401"]
"onedoor/guardrail/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# ND-025 follow-up. 19 test modules do `from tests.conftest import ...`, and
# tests/protocol imports scripts.verify_memo -- both need the repository root on
# sys.path. `python -m pytest` puts it there implicitly (python -m prepends CWD);
# the bare `pytest` CI runs does not. So the suite passed locally and failed in CI
# with 20 collection errors, ModuleNotFoundError: No module named 'tests'.
#
# Latent since long before ND-025: the Tests step never ran, because the lint step
# ahead of it always failed first. Making the earlier gates pass is what exposed it.
# `pythonpath` is pytest's explicit answer and makes the two invocations equivalent,
# so a green run locally means a green run in CI. Verify with BARE `pytest`.
pythonpath = ["."]

[tool.mypy]
strict = true

# OpenTelemetry is an optional extra: telemetry.py imports it inside a try/except
# and no-ops without it. CI installs [dev], not [otel], so the import is absent by
# design -- that is the behaviour the module is built for, not a missing dependency.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# Vendored verbatim from core's pinned artifact. Type-annotating it would mean
# editing it, and the whole guarantee is that it is not edited. A test asserts it
# stays byte-identical to reference/rederivable-manifest/canonical.py.
[[tool.mypy.overrides]]
module = ["onedoor._vendor.*"]
ignore_errors = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onedoor*"]

# Without this the wheel ships the Python modules and drops
# onedoor/store/migrations/*.sql, so Database.init() applies no migrations and the
# first query fails with "no such table: policies". 0.3.0 on PyPI has this defect.
[tool.setuptools.package-data]
onedoor = [
    "store/migrations/*.sql",
    "viewer/_vendor/*.md",
    # ND-055/V1. The Policy Studio v2 token block, extracted verbatim from the
    # mockup R055 names as binding design authority. `studio/tokens.py` pins its
    # SHA-256 and RAISES rather than falling back, so a wheel without this file is
    # a Studio that cannot render at all -- the 0.3.0 missing-migrations failure
    # shape, and the reason it is declared here in the same breath as being written.
    "studio/_vendor/*.css",
    "studio/_fixture/HEAD",
    # ND-052/S5. The shipped policy packs -- the YAML the engine loads AND the PACK.md
    # boundary statement, because both are inside PACK_DIGEST and because a pack whose
    # "what this is not" page did not travel would be the overclaim the page prevents.
    # Caught by `tests/templates/test_pack.py::test_the_pack_is_in_the_built_wheel`,
    # which failed on the first build exactly as the 0.3.0 defect would have.
    "templates/*/*.yaml",
    "templates/*/*.md",
]
