# Policies for the LiteLLM guardrail example. Two governed surfaces:
#   llm.completion   — the model call itself (which models, how many per day)
#   mcp.<tool>       — MCP tool calls routed through LiteLLM's MCP gateway
policies:
  - action_type: llm.completion
    tier: 1
    dry_run: false
    compensating_command: niyam.noop      # a completion is harmless to "reverse" by noop
    bounds:
      enum:
        model: [gpt-4o-mini, claude-sonnet-5, mistral-small-2603]
      required: [model]
      strict_params: false
    caps:
      daily_rate: 1000

  - action_type: mcp.get_weather
    tier: 1
    dry_run: false
    compensating_command: niyam.noop
    bounds:
      required: [city]
      strict_params: true

  - action_type: mcp.send_payment
    tier: 3                               # money: propose-and-confirm, always
    bounds:
      numeric:
        amount_eur: { min: 0.01, max: 500 }
      required: [payee, amount_eur]
      strict_params: true

  - action_type: niyam.noop
    tier: 1
    dry_run: false
    compensating_command: niyam.noop
    bounds:
      strict_params: false
  # Any tool NOT listed (e.g. delete_everything) default-denies to Tier 3.
